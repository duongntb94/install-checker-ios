# XcodeGen spec:  brew install xcodegen && cd ios && xcodegen
name: NetworkChecker
options:
  bundleIdPrefix: com.dan.poc
  deploymentTarget:
    iOS: "17.0"
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    from: 0.16.0
targets:
  NetworkChecker:
    type: application
    platform: iOS
    sources:
      - path: NetworkChecker
      - path: prompt.txt
        buildPhase: resources
      # Model không nằm trong app: lần đầu mở app tải từ GitHub release (xem README › Models).
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    entitlements:
      path: NetworkChecker/NetworkChecker.entitlements
      # Phải khai báo ở đây: xcodegen ghi đè file .entitlements bằng nội dung của `properties`.
      # Nâng giới hạn RAM cho app — bắt buộc để chạy model ~3.6 GB trên iPhone 15 Pro (8 GB).
      # extended-virtual-addressing: Personal Team (Apple ID miễn phí) không ký được -> chỉ bật khi dùng team trả phí.
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: NetworkChecker/Info.plist
      properties:
        CFBundleDisplayName: Install Checker
        UILaunchScreen: {}
        # Model tải từ GitHub release (repo public, không cần auth). Mỗi release có asset manifest.json.
        # Đổi tag khi phát hành model mới -> app tự xoá bản cũ và tải bản mới.
        ModelReleaseBaseURL: "https://github.com/duongntb94/install-checker-ios/releases/download"
        GemmaModelTag: "model-v2"
        YOLOModelTag: "yolo-v1"
        DETRModelTag: "detr-v1"
        NSCameraUsageDescription: Chụp ảnh setup mạng để kiểm tra lỗi lắp đặt.
        NSPhotoLibraryUsageDescription: Chọn ảnh setup mạng để kiểm tra.
        # Cho phép copy model.litertlm vào app qua Finder / Files
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        DEVELOPMENT_TEAM: VJH27C99ZX   # Personal Team của Dan
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
